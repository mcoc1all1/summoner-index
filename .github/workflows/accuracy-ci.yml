name: Pull request checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - name: Reject stale or incomplete rights approvals
        run: npm run rights:check
      - name: Build and check public beta
        run: npm run build && node scripts/check-beta.mjs
        env:
          SITE_ORIGIN: https://mcoc1all1.github.io
          SITE_BASE_PATH: /summoner-index
          PUBLIC_BETA: '1'

      - name: Reject unsafe public distribution files and accidental indexing
        run: npm run distribution:preflight
      - name: Verify isolated, noindex public-site staging (no remote writes)
        run: node scripts/stage-clean-publication.mjs --output "$RUNNER_TEMP/summoner-beta-snapshot"
