name: Check official MCOC announcements

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: live-feed-update
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check official News & Announcements feed
        run: node scripts/update-live-feed.mjs
      - name: Validate site after feed update
        run: |
          npm run build
          npm test
      - name: Publish safe official announcement metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- content/live.json; then
            echo "No official feed changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/live.json
          git commit -m "Refresh official MCOC announcements"
          git push origin HEAD:main
