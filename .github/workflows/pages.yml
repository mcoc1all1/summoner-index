name: Publish public beta
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - name: Reject stale or incomplete rights approvals
        run: npm run rights:check
      - name: Build public beta
        run: npm run build && node scripts/check-beta.mjs
        env:
          SITE_ORIGIN: https://mcoc1all1.github.io
          SITE_BASE_PATH: /summoner-index
          PUBLIC_BETA: '1'
      - name: Reject unsafe public distribution files and accidental indexing
        run: npm run distribution:preflight
      - name: Audit commercial readiness (advisory; no advertisements enabled)
        run: npm run commercial:audit
      - name: Inventory all content reuse candidates (advisory)
        run: npm run rights:triage
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
