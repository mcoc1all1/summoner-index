name: Legacy public-source publishing disabled

# The live Pages site remains available from its most recent successful build.
# The verified site-only output is staged on the separate site-publish branch.
# This legacy main-branch workflow must not redeploy private research sources.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the publishing migration
        run: |
          echo "Old public source build/deploy is frozen after staging site-publish."
          echo "Current live site stays available until GitHub Pages source is switched by the owner."
          echo "Future generated public website content comes from private summoner-index-source."
          echo "All pages must remain noindex; no ads are authorized."
          echo "No deployment is performed by this legacy workflow."
